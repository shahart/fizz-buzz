name: Web and Worker tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Web and Worker tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript web client
        run: pnpm --filter seven-boom-web-tests run build

      - name: Install Playwright Chromium
        run: pnpm --filter seven-boom-web-tests exec playwright install --with-deps chromium

      - name: Type-check and test Worker and web client
        run: pnpm --filter global-seven-boom-worker run check

      - name: Run browser UI tests
        run: pnpm --filter seven-boom-web-tests run test:browser
