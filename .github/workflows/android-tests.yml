name: Android tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Android unit and Activity tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android unit and Activity tests in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: sdkmanager "platforms;android-37.0" && ./gradlew :composeApp:testDebugUnitTest :composeApp:connectedDebugAndroidTest --no-daemon --stacktrace
