<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#EAF4FF">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <title>fizz-buzz 7-boom</title>
    <script>
        const isHebrew = (navigator.language || "").toLowerCase().startsWith("he");
        document.documentElement.lang = isHebrew ? "he" : "en";
        document.documentElement.dir = isHebrew ? "rtl" : "ltr";
        if (isHebrew) {
            document.title = "פיז-באז 7-בום";
        }
    </script>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
        body { background: #EAF4FF; }
    </style>
</head>
<body>
    <script>
        const appScript = document.createElement("script");
        appScript.src = `composeApp.js?v=${Date.now()}`;
        document.body.appendChild(appScript);
    </script>
</body>
</html>
