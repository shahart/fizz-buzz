<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eaf4ff">
  <meta name="description" content="A quick global 7-Boom number game. Say or tap the number, or hit BOOM for sevens.">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
  <title>7-Boom 1.1</title>
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite"></main>

  <dialog id="nickname-dialog" class="dialog" aria-labelledby="nickname-title">
    <div class="dialog-head">
      <div><p class="eyebrow" data-copy="nicknameEyebrow"></p><h2 id="nickname-title" data-copy="chooseEmoji"></h2></div>
      <button class="icon-button" type="button" data-action="close-nickname" data-label="close" aria-label="Close">×</button>
    </div>
    <div id="emoji-grid" class="emoji-grid"></div>
  </dialog>

  <dialog id="theme-dialog" class="dialog" aria-labelledby="theme-title">
    <div class="dialog-head">
      <div><p class="eyebrow" data-copy="preferences"></p><h2 id="theme-title" data-copy="themes"></h2></div>
      <button class="icon-button" type="button" data-action="close-theme" data-label="close" aria-label="Close">×</button>
    </div>
    <div id="theme-options" class="theme-options"></div>
  </dialog>

  <dialog id="roster-dialog" class="dialog" aria-labelledby="roster-title">
    <div class="dialog-head">
      <div><p class="eyebrow" data-copy="liveGame"></p><h2 id="roster-title"></h2></div>
      <button class="icon-button" type="button" data-action="close-roster" data-label="close" aria-label="Close">×</button>
    </div>
    <div id="roster-list" class="roster-list"></div>
    <p id="roster-active-hint" class="dialog-note" hidden></p>
  </dialog>

  <dialog id="offline-dialog" class="dialog offline-dialog" aria-labelledby="offline-title">
    <div class="offline-icon" aria-hidden="true">⌁</div>
    <p class="eyebrow" data-copy="connection"></p>
    <h2 id="offline-title" data-copy="soloTitle"></h2>
    <p class="dialog-note" data-copy="soloMessage"></p>
    <button class="primary-button" type="button" data-action="continue-solo" data-copy="continue"></button>
  </dialog>

  <script src="./firebase-config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
